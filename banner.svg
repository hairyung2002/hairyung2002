<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0e7ff"/>
      <stop offset="0.55" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="laneReq" gradientUnits="userSpaceOnUse" x1="640" y1="0" x2="1080" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="laneRes" gradientUnits="userSpaceOnUse" x1="640" y1="0" x2="1080" y2="0">
      <stop offset="0" stop-color="#c084fc" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#c084fc" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="340" rx="18"/></clipPath>
    <clipPath id="typeClip"><rect class="typer" x="80" y="96" width="0" height="36"/></clipPath>

    <!-- lanes: request (→) on top, response (←) on bottom -->
    <path id="req1" d="M672 160 L 828 160"/>
    <path id="req2" d="M892 160 L 1048 160"/>
    <path id="res1" d="M1048 180 L 892 180"/>
    <path id="res2" d="M828 180 L 672 180"/>

    <style>
      .mono { font-family: 'JetBrains Mono','SF Mono',Menlo,Consolas,'Courier New',monospace; }
      .sans { font-family: 'Pretendard','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif; }
      .typer { animation: type 1.1s steps(13) 0.3s forwards; }
      .cursor { animation: blink 1s step-end infinite; }
      .fade1 { opacity: 0; animation: up .9s ease-out 1.4s forwards; }
      .fade2 { opacity: 0; animation: up .9s ease-out 1.9s forwards; }
      .fade3 { opacity: 0; animation: up .9s ease-out 2.2s forwards; }
      .blobA { animation: driftA 14s ease-in-out infinite alternate; }
      .blobB { animation: driftB 18s ease-in-out infinite alternate; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .led1 { animation: led 1.4s steps(2) infinite; }
      .led2 { animation: led 1.4s steps(2) .7s infinite; }
      .spin { animation: spin 12s linear infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes type { to { width: 220px; } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes driftA { to { transform: translate(120px, 40px); } }
      @keyframes driftB { to { transform: translate(-140px, -30px); } }
      @keyframes pulse { 0%,100% { opacity: .5; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
      @keyframes led { 0% { opacity: 1; } 100% { opacity: .25; } }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <!-- background -->
    <rect width="1200" height="340" fill="url(#bg)"/>
    <circle class="blobA" cx="260" cy="60" r="190" fill="#4f46e5" opacity="0.35" filter="url(#blur)"/>
    <circle class="blobB" cx="980" cy="300" r="210" fill="#0891b2" opacity="0.30" filter="url(#blur)"/>
    <circle cx="760" cy="30" r="120" fill="#7c3aed" opacity="0.18" filter="url(#blur)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>

    <!-- left: identity -->
    <g clip-path="url(#typeClip)">
      <text x="80" y="122" class="mono" font-size="22" fill="#94a3b8"><tspan fill="#22d3ee">~</tspan> $ whoami<tspan class="cursor" fill="#22d3ee" font-weight="700"> _</tspan></text>
    </g>

    <text x="76" y="200" class="sans fade1" font-size="68" font-weight="800" letter-spacing="-1.5" fill="url(#nameGrad)">Kwack Doyoun</text>

    <g class="mono" font-size="15">
      <g class="fade2">
        <rect x="80" y="226" width="236" height="32" rx="16" fill="#06b6d4" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.45"/>
        <circle cx="98" cy="242" r="4" fill="#22d3ee"/>
        <text x="206" y="247" text-anchor="middle" fill="#a5f3fc">Web Full-Stack Developer</text>
      </g>
      <g class="fade3">
        <rect x="328" y="226" width="246" height="32" rx="16" fill="#a855f7" fill-opacity="0.12" stroke="#c084fc" stroke-opacity="0.45"/>
        <circle cx="346" cy="242" r="4" fill="#c084fc"/>
        <text x="459" y="247" text-anchor="middle" fill="#e9d5ff">System Software Developer</text>
      </g>
    </g>

    <!-- right: client ⇄ network ⇄ server -->
    <g transform="translate(30 0)">
    <g fill="none" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round">
      <use href="#req1" stroke="url(#laneReq)"/><use href="#req2" stroke="url(#laneReq)"/>
      <use href="#res1" stroke="url(#laneRes)"/><use href="#res2" stroke="url(#laneRes)"/>
    </g>

    <g filter="url(#glow)">
      <g fill="#67e8f9">
        <circle r="3.5"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#req1"/></animateMotion></circle>
        <circle r="3.5"><animateMotion dur="1.6s" begin="-0.8s" repeatCount="indefinite"><mpath href="#req1"/></animateMotion></circle>
        <circle r="3.5"><animateMotion dur="1.6s" begin="-0.4s" repeatCount="indefinite"><mpath href="#req2"/></animateMotion></circle>
        <circle r="3.5"><animateMotion dur="1.6s" begin="-1.2s" repeatCount="indefinite"><mpath href="#req2"/></animateMotion></circle>
      </g>
      <g fill="#d8b4fe">
        <circle r="3.5"><animateMotion dur="1.6s" begin="-0.2s" repeatCount="indefinite"><mpath href="#res1"/></animateMotion></circle>
        <circle r="3.5"><animateMotion dur="1.6s" begin="-1.0s" repeatCount="indefinite"><mpath href="#res1"/></animateMotion></circle>
        <circle r="3.5"><animateMotion dur="1.6s" begin="-0.6s" repeatCount="indefinite"><mpath href="#res2"/></animateMotion></circle>
        <circle r="3.5"><animateMotion dur="1.6s" begin="-1.4s" repeatCount="indefinite"><mpath href="#res2"/></animateMotion></circle>
      </g>
    </g>

    <g class="mono" font-size="13" text-anchor="middle">
      <!-- browser -->
      <rect x="608" y="138" width="64" height="64" rx="16" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.6"/>
      <rect class="pulse" x="608" y="138" width="64" height="64" rx="16" fill="none" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="4"/>
      <g fill="none" stroke="#67e8f9" stroke-width="1.8">
        <rect x="624" y="157" width="32" height="24" rx="3"/>
        <line x1="624" y1="163" x2="656" y2="163"/>
      </g>
      <g fill="#67e8f9"><circle cx="628" cy="160" r="1"/><circle cx="632" cy="160" r="1"/><circle cx="636" cy="160" r="1"/></g>
      <text x="640" y="226" fill="#a5f3fc">browser</text>

      <!-- server -->
      <rect x="828" y="138" width="64" height="64" rx="16" fill="#0f172a" stroke="#818cf8" stroke-opacity="0.6"/>
      <rect class="pulse" x="828" y="138" width="64" height="64" rx="16" fill="none" stroke="#818cf8" stroke-opacity="0.35" stroke-width="4"/>
      <g fill="none" stroke="#a5b4fc" stroke-width="1.8">
        <rect x="844" y="155" width="32" height="12" rx="3"/>
        <rect x="844" y="173" width="32" height="12" rx="3"/>
      </g>
      <circle class="led1" cx="850" cy="161" r="1.8" fill="#4ade80"/>
      <circle class="led2" cx="850" cy="179" r="1.8" fill="#4ade80"/>
      <g stroke="#a5b4fc" stroke-width="1.5" stroke-opacity="0.6">
        <line x1="860" y1="161" x2="870" y2="161"/><line x1="860" y1="179" x2="870" y2="179"/>
      </g>
      <text x="860" y="226" fill="#c7d2fe">server</text>

      <!-- kernel (chip) -->
      <rect x="1048" y="138" width="64" height="64" rx="16" fill="#0f172a" stroke="#c084fc" stroke-opacity="0.6"/>
      <rect class="pulse" x="1048" y="138" width="64" height="64" rx="16" fill="none" stroke="#c084fc" stroke-opacity="0.35" stroke-width="4"/>
      <g fill="none" stroke="#d8b4fe" stroke-width="1.8">
        <rect x="1068" y="158" width="24" height="24" rx="3"/>
        <rect x="1075" y="165" width="10" height="10" rx="1.5" fill="#c084fc" fill-opacity="0.35"/>
      </g>
      <g stroke="#d8b4fe" stroke-width="1.6" stroke-linecap="round">
        <line x1="1074" y1="153" x2="1074" y2="157"/><line x1="1080" y1="153" x2="1080" y2="157"/><line x1="1086" y1="153" x2="1086" y2="157"/>
        <line x1="1074" y1="183" x2="1074" y2="187"/><line x1="1080" y1="183" x2="1080" y2="187"/><line x1="1086" y1="183" x2="1086" y2="187"/>
        <line x1="1063" y1="164" x2="1067" y2="164"/><line x1="1063" y1="170" x2="1067" y2="170"/><line x1="1063" y1="176" x2="1067" y2="176"/>
        <line x1="1093" y1="164" x2="1097" y2="164"/><line x1="1093" y1="170" x2="1097" y2="170"/><line x1="1093" y1="176" x2="1097" y2="176"/>
      </g>
      <text x="1080" y="226" fill="#e9d5ff">kernel</text>

      <!-- lane labels -->
      <text x="750" y="150" font-size="11" fill="#67e8f9" fill-opacity="0.75">HTTP</text>
      <text x="970" y="150" font-size="11" fill="#d8b4fe" fill-opacity="0.75">syscall</text>
    </g>

    </g>

    <!-- border -->
    <rect x="0.5" y="0.5" width="1199" height="339" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  </g>
</svg>
